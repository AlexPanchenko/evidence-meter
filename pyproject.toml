[project]
name = "evidence-meter"
version = "0.1.0"
description = "Turns a written guide of engineering metrics into a tested tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
evidence-meter = "evidence_meter.entrypoints.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# .env files are read-denied in the agent sandbox; never collect them.
addopts = "-ra --strict-markers --ignore=.env --ignore=.env.example"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
